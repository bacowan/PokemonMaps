# Runtime settings for raster_to_pokemon.py.
# Copy this file to config.toml (which is git ignored) and fill in your paths.
# Relative paths are resolved from the directory this file is in.

# Input .tif raster
raster = "path/to/map.tif"

# Road lines (e.g. .gpkg), in the same CRS as the raster
roads = "path/to/roads.gpkg"

# Output path, without extension
output = "output/render"